<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTEX - Monitoreo IoT Industrial</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-messaging.js"></script>

  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .card-glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 0.6); }
    .card-glow-yellow { box-shadow: 0 0 20px rgba(234, 179, 8, 0.35); border-color: rgba(234, 179, 8, 0.6); }
    .card-glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.25); border-color: rgba(30, 41, 59, 1); }
  </style>
</head>
<body class="pb-24 min-h-screen">

  <!-- ENCABEZADO -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-50 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-3">
      <div id="indicador-conexion" class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse" title="Conectado a Firebase"></div>
      <div>
        <h1 class="text-xl font-black tracking-wider text-amber-500 leading-none">VOLTEX</h1>
        <p class="text-[10px] text-slate-400 font-medium tracking-wider uppercase mt-0.5">Telemetría Industrial IoT</p>
      </div>
    </div>
    <span class="text-xs bg-slate-800 text-slate-300 font-semibold px-3 py-1 rounded-full border border-slate-700 shadow-inner">
      Juan Ledesma
    </span>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="p-4 max-w-md mx-auto space-y-5">

    <!-- FILTROS POR RUBRO -->
    <section>
      <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-2">Filtrar por Rubro</p>
      <div class="grid grid-cols-4 gap-2 text-xs font-bold text-center">
        <button onclick="filtrarRubro('todos')" id="btn-todos" class="py-2.5 rounded-xl bg-amber-500 text-slate-950 shadow-md transition-all">Todos</button>
        <button onclick="filtrarRubro('agua')" id="btn-agua" class="py-2.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-700/60 hover:bg-slate-700 transition-all">Agua</button>
        <button onclick="filtrarRubro('frio')" id="btn-frio" class="py-2.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-700/60 hover:bg-slate-700 transition-all">Frío</button>
        <button onclick="filtrarRubro('ascensores')" id="btn-ascensores" class="py-2.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-700/60 hover:bg-slate-700 transition-all">Ascensores</button>
      </div>
    </section>

    <!-- MONITOR DE AGUA EN VIVO (DON FÉLIX) -->
    <section id="panel-don-felix" class="bg-slate-900 border border-slate-800 rounded-2xl p-5 transition-all duration-500 card-glow-green relative overflow-hidden">
      <div class="flex justify-between items-start mb-4">
        <div>
          <span class="text-[10px] font-extrabold uppercase tracking-widest text-slate-400 block mb-1">Módulo Nivel de Agua</span>
          <h2 class="font-extrabold text-xl text-slate-100">Don Félix</h2>
        </div>
        <span id="badge-estado" class="text-xs font-black px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 uppercase tracking-wider">
          NORMAL
        </span>
      </div>

      <div class="space-y-3 bg-slate-950/60 p-4 rounded-xl border border-slate-800/80">
        <div class="flex justify-between items-center text-sm">
          <span class="text-slate-400 font-medium">Estado del Tanque:</span>
          <span id="texto-nivel-agua" class="font-bold text-emerald-400">Correcto (> 50%)</span>
        </div>

        <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700/50">
          <div id="barra-progreso" class="bg-emerald-500 h-2 rounded-full w-full transition-all duration-700 ease-out"></div>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800/80 text-xs">
          <div class="flex items-center space-x-2">
            <div id="indicador-boya-50" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
            <span class="text-slate-300">Boya 50% (Medio)</span>
          </div>
          <div class="flex items-center space-x-2">
            <div id="indicador-boya-vacio" class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
            <span class="text-slate-300">Boya Vacío (Crítico)</span>
          </div>
        </div>
      </div>

      <div class="mt-3 flex justify-between items-center text-[11px] text-slate-500">
        <span>Hardware: ESP32 NodeMCU</span>
        <span id="ultima-actualizacion">Actualizado en vivo</span>
      </div>
    </section>

    <!-- LISTADO DINÁMICO DE TODOS LOS CLIENTES (DESDE FIREBASE) -->
    <section class="space-y-3">
      <h3 class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Instalaciones Monitoreadas</h3>
      <div id="lista-clientes" class="space-y-3">
        <!-- Se renderiza dinámicamente desde /clientes_lista/ -->
      </div>
    </section>

  </main>

  <!-- LÓGICA JAVASCRIPT PRINCIPAL -->
  <script>
    const firebaseConfig = {
      databaseURL: "https://voltex-iot-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let rubroActual = 'todos';
    let clientesData = {};

    // 1. Registro del Service Worker para Notificaciones Push Escandalosas
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker activo:', reg.scope))
          .catch((err) => console.error('Error Service Worker:', err));
      });
    }

    if ('Notification' in window) {
      Notification.requestPermission();
    }

    // 2. Escucha en Tiempo Real para la Telemetría de Don Félix (Agua)
    db.ref('/clientes/don_felix/telemetria/agua').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      const boyaMedio = data.boya_medio_tanque || false;
      const boyaFalta = data.boya_falta_agua || false;

      const panel = document.getElementById('panel-don-felix');
      const badge = document.getElementById('badge-estado');
      const textoNivel = document.getElementById('texto-nivel-agua');
      const barra = document.getElementById('barra-progreso');
      const indMedio = document.getElementById('indicador-boya-50');
      const indVacio = document.getElementById('indicador-boya-vacio');
      const textoHora = document.getElementById('ultima-actualizacion');

      const horaActual = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      textoHora.innerText = 'Act. ' + horaActual;

      if (boyaFalta) {
        panel.className = "bg-slate-900 border rounded-2xl p-5 transition-all duration-500 card-glow-red relative overflow-hidden";
        badge.className = "text-xs font-black px-3 py-1 rounded-full bg-red-500/20 text-red-400 border border-red-500/40 uppercase tracking-wider animate-pulse";
        badge.innerText = "¡CRÍTICO!";
        textoNivel.className = "font-bold text-red-400";
        textoNivel.innerText = "TANQUE VACÍO (0%)";
        barra.className = "bg-red-500 h-2 rounded-full w-1/12 transition-all duration-700 ease-out";
        indMedio.className = "w-2.5 h-2.5 rounded-full bg-red-500";
        indVacio.className = "w-2.5 h-2.5 rounded-full bg-red-500 animate-ping";
      } else if (boyaMedio) {
        panel.className = "bg-slate-900 border rounded-2xl p-5 transition-all duration-500 card-glow-yellow relative overflow-hidden";
        badge.className = "text-xs font-black px-3 py-1 rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/40 uppercase tracking-wider";
        badge.innerText = "ALERTA";
        textoNivel.className = "font-bold text-amber-400";
        textoNivel.innerText = "MEDIO TANQUE (< 50%)";
        barra.className = "bg-amber-500 h-2 rounded-full w-1/2 transition-all duration-700 ease-out";
        indMedio.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
        indVacio.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
      } else {
        panel.className = "bg-slate-900 border rounded-2xl p-5 transition-all duration-500 card-glow-green relative overflow-hidden";
        badge.className = "text-xs font-black px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 uppercase tracking-wider";
        badge.innerText = "NORMAL";
        textoNivel.className = "font-bold text-emerald-400";
        textoNivel.innerText = "Correcto (> 50%)";
        barra.className = "bg-emerald-500 h-2 rounded-full w-full transition-all duration-700 ease-out";
        indMedio.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
        indVacio.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
      }
    });

    // 3. Carga Automática e Inalterable de la Lista de Clientes desde /clientes_lista/
    db.ref('/clientes_lista').on('value', (snapshot) => {
      clientesData = snapshot.val() || {};
      renderizarClientes();
    });

    function filtrarRubro(rubro) {
      rubroActual = rubro;
      const botones = ['todos', 'agua', 'frio', 'ascensores'];
      
      botones.forEach(b => {
        const btn = document.getElementById(`btn-${b}`);
        if (b === rubro) {
          btn.className = "py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold shadow-md transition-all";
        } else {
          btn.className = "py-2.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-700/60 hover:bg-slate-700 transition-all";
        }
      });

      renderizarClientes();
    }

    function renderizarClientes() {
      const contenedor = document.getElementById('lista-clientes');
      contenedor.innerHTML = '';

      const panelDonFelix = document.getElementById('panel-don-felix');
      if (rubroActual === 'todos' || rubroActual === 'agua') {
        panelDonFelix.style.display = 'block';
      } else {
        panelDonFelix.style.display = 'none';
      }

      Object.keys(clientesData).forEach(key => {
        const cliente = clientesData[key];

        // Filtrar por rubro activo
        if (rubroActual !== 'todos' && !cliente[rubroActual]) {
          return;
        }

        // Si es Don Félix y estamos en Agua o Todos, omitir del listado secundario para no duplicar
        if (key === 'don_felix' && (rubroActual === 'todos' || rubroActual === 'agua')) return;

        const card = document.createElement('div');
        card.className = 'bg-slate-900/90 border border-slate-800/80 rounded-xl p-4 flex justify-between items-center shadow-md';
        
        let rubroTexto = [];
        if (cliente.agua) rubroTexto.push('Agua');
        if (cliente.frio) rubroTexto.push('Frío');
        if (cliente.ascensores) rubroTexto.push('Ascensores');

        card.innerHTML = `
          <div>
            <h4 class="font-bold text-slate-200 text-base">${cliente.nombre || key}</h4>
            <p class="text-xs text-slate-400 mt-0.5">${rubroTexto.join(' • ')}</p>
          </div>
          <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-lg border border-slate-700/80 font-medium">
            Monitoreado
          </span>
        `;
        contenedor.appendChild(card);
      });
    }
  </script>
</body>
</html>
