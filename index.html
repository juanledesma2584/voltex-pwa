<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTEX Enterprise IoT</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151c2e;
      --border: #232d42;
      --accent: #38bdf8;
      --green: #10b981;
      --red: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --subtext: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .brand { 
      font-size: 1.4rem; 
      font-weight: 900; 
      color: var(--accent); 
      letter-spacing: 1.5px; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }

    .brand-logo-svg {
      width: 38px;
      height: 38px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .client-picker {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      outline: none;
    }

    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }

    .module-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .card-alarm {
      background-color: #3b0707 !important;
      border: 2px solid var(--red) !important;
      animation: pulse-red 1s infinite alternate;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
      100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .card-title { font-weight: 700; font-size: 1.1rem; color: var(--text); display: flex; align-items: center; gap: 8px; }

    /* Estilos Módulo Ascensor */
    .elevator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 15px;
    }

    .floor-display {
      background: #0f172a;
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .floor-number {
      font-size: 3.2rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      margin: 8px 0;
    }

    .stat-card {
      background: #0f172a;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
    }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-weight: 700; cursor: pointer; margin-top: 15px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-on { background: var(--green); color: white; }
    .btn-off { background: var(--red); color: white; }
    .btn-secondary { background: #334155; color: white; margin-top: 10px; }
    .btn-danger { background: var(--red); color: white; margin-top: 10px; }

    .status-box {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px; border-radius: 12px; background: #0f172a; border: 1px solid var(--border); text-align: center; gap: 10px;
    }
    .status-icon { font-size: 3.5rem; }
    .status-ok { color: var(--green); }
    .status-critico { color: var(--red); }

    .admin-panel {
      margin-top: 20px; padding: 16px; background: rgba(255,255,255,0.02);
      border: 1px dashed var(--border); border-radius: 12px; text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <div class="brand-logo-svg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
        </svg>
      </div>
      <span>VOLTEX</span>
    </div>
    <select class="client-picker" id="selectCliente" onchange="cargarCliente(this.value)"></select>
  </div>

  <div class="container">
    <!-- NAVEGACIÓN MÓDULOS -->
    <div class="module-nav">
      <button class="tab-btn active" onclick="verModulo('ascensor', event)"><i class="fa-solid fa-elevator"></i> Ascensores</button>
      <button class="tab-btn" onclick="verModulo('agua', event)"><i class="fa-solid fa-droplet"></i> Suministro Agua</button>
      <button class="tab-btn" onclick="verModulo('hardware', event)"><i class="fa-solid fa-microchip"></i> Hardware ESP32</button>
    </div>

    <!-- MÓDULO ASCENSORES -->
    <div id="mod-ascensor">
      <div class="card" id="tarjetaAscensor">
        <div class="card-header">
          <div class="card-title"><i class="fa-solid fa-elevator"></i> Ascensor Principal</div>
          <small id="badgeAscensor" style="color: var(--green); font-weight:700;">OPERATIVO</small>
        </div>

        <div class="elevator-grid">
          <div class="floor-display">
            <small style="color: var(--subtext);">PISO ACTUAL</small>
            <div class="floor-number" id="pisoActual">--</div>
            <small style="color: var(--accent);" id="dirMovimiento"><i class="fa-solid fa-arrows-up-down"></i> Detenido</small>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div class="stat-card">
              <small style="color: var(--subtext);">Serie Puertas</small>
              <div style="font-weight: 800; margin-top: 4px; color: var(--green);" id="estadoPuerta">CERRADAS</div>
            </div>
            <div class="stat-card">
              <small style="color: var(--subtext);">Modo Tablero</small>
              <div style="font-weight: 800; margin-top: 4px; color: var(--accent);" id="modoTablero">AUTOMÁTICO</div>
            </div>
          </div>
        </div>

        <button id="btnMuteAscensor" class="btn btn-secondary" style="display: none;" onclick="silenciarAlarma()">
          <i class="fa-solid fa-volume-xmark"></i> Silenciar Alerta Sonora
        </button>

        <button id="btnMantenimiento" class="btn btn-secondary" onclick="toggleMantenimiento()">
          <i class="fa-solid fa-wrench"></i> MODO MANTENIMIENTO
        </button>
      </div>
    </div>

    <!-- MÓDULO AGUA -->
    <div id="mod-agua" style="display: none;">
      <div class="card" id="tarjetaAgua">
        <div class="card-header">
          <div class="card-title"><i class="fa-solid fa-water"></i> Nivel Tanque (Boya)</div>
          <small id="badgeEstado" style="color: var(--green); font-weight:700;">SISTEMA OK</small>
        </div>
        <div class="status-box">
          <div class="status-icon" id="iconoBoya"><i class="fa-solid fa-circle-check status-ok"></i></div>
          <h2 id="textoEstado">Suministro Normal</h2>
          <p id="subtextoEstado" style="color: var(--subtext); font-size: 0.9rem;">Nivel por encima del 50%</p>
        </div>
        <button id="btnBomba" class="btn btn-off" onclick="toggleBomba()">CARGANDO...</button>
      </div>
    </div>

    <!-- HARDWARE -->
    <div id="mod-hardware" style="display: none;">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fa-solid fa-microchip"></i> Dispositivos Asignados</div>
        </div>
        <div id="listaDispositivos"><p style="color: var(--subtext); text-align: center;">Cargando...</p></div>
      </div>
    </div>

    <div class="admin-panel">
      <small style="color: var(--subtext);">Gestión de Infraestructura</small>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-secondary" style="margin:0;" onclick="nuevoCliente()"><i class="fa-solid fa-plus"></i> Nuevo Cliente</button>
        <button class="btn btn-danger" style="margin:0;" onclick="eliminarClienteActual()"><i class="fa-solid fa-trash"></i> Eliminar</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://voltex-iot-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let clienteActual = '';
    let modoMantenimiento = false;
    let audioCtx = null;
    let alarmInterval = null;
    let alarmaSilenciada = false;

    function sonarAlarma() {
      if (alarmaSilenciada) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function iniciarSirena() { if (!alarmInterval) alarmInterval = setInterval(sonarAlarma, 800); }
    function detenerSirena() { if (alarmInterval) { clearInterval(alarmInterval); alarmInterval = null; } }
    function silenciarAlarma() { alarmaSilenciada = true; detenerSirena(); document.getElementById('btnMuteAscensor').style.display = 'none'; }

    db.ref('/clientes').on('value', (snapshot) => {
      const picker = document.getElementById('selectCliente');
      picker.innerHTML = '';
      const clientes = snapshot.val();
      if (!clientes) return;

      Object.keys(clientes).forEach(id => {
        const option = document.createElement('option');
        option.value = id;
        option.innerText = clientes[id].nombre || id;
        picker.appendChild(option);
      });

      if (!clienteActual || !clientes[clienteActual]) {
        clienteActual = Object.keys(clientes)[0];
      }
      picker.value = clienteActual;
      cargarCliente(clienteActual);
    });

    function cargarCliente(clienteId) {
      if(!clienteId) return;
      clienteActual = clienteId;

      // 1. Escuchar Telemetría del Ascensor
      db.ref(`/clientes/${clienteActual}/telemetria/ascensor`).on('value', (snap) => {
        const data = snap.val() || {};
        document.getElementById('pisoActual').innerText = data.piso !== undefined ? data.piso : 'PB';
        document.getElementById('dirMovimiento').innerText = data.movimiento || 'Detenido';
        document.getElementById('estadoPuerta').innerText = data.puertas || 'CERRADAS';
        
        const tarjeta = document.getElementById('tarjetaAscensor');
        const badge = document.getElementById('badgeAscensor');
        const btnMute = document.getElementById('btnMuteAscensor');

        if (data.falla) {
          tarjeta.className = "card card-alarm";
          badge.innerText = "¡FALLA TÉCNICA!";
          badge.style.color = "var(--red)";
          btnMute.style.display = 'flex';
          iniciarSirena();
        } else {
          tarjeta.className = "card";
          badge.innerText = "OPERATIVO";
          badge.style.color = "var(--green)";
          btnMute.style.display = 'none';
          detenerSirena();
        }
      });

      // 2. Escuchar Modo Mantenimiento
      db.ref(`/clientes/${clienteActual}/telemetria/ascensor/mantenimiento`).on('value', (snap) => {
        modoMantenimiento = snap.val() || false;
        const btn = document.getElementById('btnMantenimiento');
        const modoLabel = document.getElementById('modoTablero');
        if (modoMantenimiento) {
          btn.className = "btn btn-off";
          btn.innerHTML = '<i class="fa-solid fa-wrench"></i> EN MANTENIMIENTO';
          modoLabel.innerText = "MANTENIMIENTO";
          modoLabel.style.color = "var(--warning)";
        } else {
          btn.className = "btn btn-secondary";
          btn.innerHTML = '<i class="fa-solid fa-wrench"></i> MODO MANTENIMIENTO';
          modoLabel.innerText = "AUTOMÁTICO";
          modoLabel.style.color = "var(--accent)";
        }
      });
    }

    function toggleMantenimiento() {
      db.ref(`/clientes/${clienteActual}/telemetria/ascensor/mantenimiento`).set(!modoMantenimiento);
    }

    function verModulo(mod, e) {
      document.getElementById('mod-ascensor').style.display = mod === 'ascensor' ? 'block' : 'none';
      document.getElementById('mod-agua').style.display = mod === 'agua' ? 'block' : 'none';
      document.getElementById('mod-hardware').style.display = mod === 'hardware' ? 'block' : 'none';

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(e) e.currentTarget.classList.add('active');
    }

    function nuevoCliente() {
      const nombre = prompt("Nombre de la nueva empresa o edificio:");
      if (nombre) {
        const id = nombre.toLowerCase().replace(/ /g, '_');
        db.ref(`/clientes/${id}`).set({
          nombre: nombre,
          telemetria: {
            ascensor: { piso: "PB", movimiento: "Detenido", puertas: "CERRADAS", falla: false, mantenimiento: false },
            agua: { boya_bajo_50: false, bomba_1_estado: false }
          }
        });
      }
    }

    function eliminarClienteActual() {
      if (confirm(`¿Borrar "${clienteActual}"?`)) {
        db.ref(`/clientes/${clienteActual}`).remove();
      }
    }
  </script>
</body>
</html>
