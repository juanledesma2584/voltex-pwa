<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTEX Enterprise IoT</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151c2e;
      --border: #232d42;
      --accent: #38bdf8;
      --green: #10b981;
      --red: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --subtext: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .brand { 
      font-size: 1.4rem; 
      font-weight: 900; 
      color: var(--accent); 
      letter-spacing: 1.5px; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }

    .brand-logo-svg {
      width: 38px;
      height: 38px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .client-picker {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      outline: none;
    }

    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }

    .module-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    /* Estilos de Alerta Crítica */
    .card-alarm {
      background-color: #3b0707 !important;
      border: 2px solid var(--red) !important;
      animation: pulse-red 1s infinite alternate;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
      100% { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .card-title { font-weight: 700; font-size: 1.1rem; color: var(--text); display: flex; align-items: center; gap: 8px; }

    .status-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-radius: 12px;
      background: #0f172a;
      border: 1px solid var(--border);
      text-align: center;
      gap: 10px;
    }

    .status-icon {
      font-size: 3.5rem;
    }

    .status-ok { color: var(--green); }
    .status-critico { color: var(--red); }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-weight: 700; cursor: pointer; margin-top: 15px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-on { background: var(--green); color: white; }
    .btn-off { background: var(--red); color: white; }
    .btn-secondary { background: #334155; color: white; margin-top: 10px; }
    .btn-danger { background: var(--red); color: white; margin-top: 10px; }

    .admin-panel {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
      border: 1px dashed var(--border);
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <div class="brand-logo-svg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
        </svg>
      </div>
      <span>VOLTEX</span>
    </div>
    <select class="client-picker" id="selectCliente" onchange="cargarCliente(this.value)"></select>
  </div>

  <div class="container">
    <div class="module-nav">
      <button class="tab-btn active" onclick="verModulo('agua', event)"><i class="fa-solid fa-droplet"></i> Suministro Agua</button>
      <button class="tab-btn" onclick="verModulo('hardware', event)"><i class="fa-solid fa-microchip"></i> Hardware ESP32</button>
    </div>

    <!-- MÓDULO AGUA CON ALERTA DE BOYA -->
    <div id="mod-agua">
      <div class="card" id="tarjetaAgua">
        <div class="card-header">
          <div class="card-title"><i class="fa-solid fa-water"></i> Nivel Tanque (Boya)</div>
          <small id="badgeEstado" style="color: var(--green); font-weight:700;">SISTEMA OK</small>
        </div>
        
        <div class="status-box">
          <div class="status-icon" id="iconoBoya"><i class="fa-solid fa-circle-check status-ok"></i></div>
          <h2 id="textoEstado">Suministro Normal</h2>
          <p id="subtextoEstado" style="color: var(--subtext); font-size: 0.9rem;">Nivel por encima del 50%</p>
        </div>

        <!-- Botón para apagar la alarma sonora si está disparada -->
        <button id="btnMute" class="btn btn-secondary" style="display: none;" onclick="silenciarAlarma()">
          <i class="fa-solid fa-volume-xmark"></i> Silenciar Alarma Sonora
        </button>

        <button id="btnBomba" class="btn btn-off" onclick="toggleBomba()">CARGANDO...</button>
      </div>
    </div>

    <!-- HARDWARE -->
    <div id="mod-hardware" style="display: none;">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fa-solid fa-microchip"></i> Dispositivos Asignados</div>
        </div>
        <div id="listaDispositivos"><p style="color: var(--subtext); text-align: center;">Cargando...</p></div>
      </div>
    </div>

    <div class="admin-panel">
      <small style="color: var(--subtext);">Gestión de Infraestructura</small>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-secondary" style="margin:0;" onclick="nuevoCliente()"><i class="fa-solid fa-plus"></i> Nuevo Cliente</button>
        <button class="btn btn-danger" style="margin:0;" onclick="eliminarClienteActual()"><i class="fa-solid fa-trash"></i> Eliminar</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://voltex-iot-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let clienteActual = '';
    let estadoBomba = false;
    let audioCtx = null;
    let alarmInterval = null;
    let alarmaSilenciada = false;

    // Generador de Sirena Sonora usando Web Audio API
    function sonarAlarma() {
      if (alarmaSilenciada) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Tono de alerta (La)
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function iniciarSirena() {
      if (!alarmInterval) {
        alarmInterval = setInterval(sonarAlarma, 800);
      }
    }

    function detenerSirena() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    function silenciarAlarma() {
      alarmaSilenciada = true;
      detenerSirena();
      document.getElementById('btnMute').style.display = 'none';
    }

    db.ref('/clientes').on('value', (snapshot) => {
      const picker = document.getElementById('selectCliente');
      picker.innerHTML = '';
      const clientes = snapshot.val();

      if (!clientes) return;

      Object.keys(clientes).forEach(id => {
        const option = document.createElement('option');
        option.value = id;
        option.innerText = clientes[id].nombre || id;
        picker.appendChild(option);
      });

      if (!clienteActual || !clientes[clienteActual]) {
        clienteActual = Object.keys(clientes)[0];
      }
      picker.value = clienteActual;
      cargarCliente(clienteActual);
    });

    function cargarCliente(clienteId) {
      if(!clienteId) return;
      clienteActual = clienteId;
      alarmaSilenciada = false;

      // Escuchar estado de la BOYA (boya_bajo_50: true/false)
      db.ref(`/clientes/${clienteActual}/telemetria/agua/boya_bajo_50`).on('value', (snap) => {
        const enAlerta = snap.val(); // true = Bajo 50% (Crítico)
        const tarjeta = document.getElementById('tarjetaAgua');
        const icono = document.getElementById('iconoBoya');
        const texto = document.getElementById('textoEstado');
        const subtexto = document.getElementById('subtextoEstado');
        const badge = document.getElementById('badgeEstado');
        const btnMute = document.getElementById('btnMute');

        if (enAlerta) {
          tarjeta.className = "card card-alarm";
          icono.innerHTML = '<i class="fa-solid fa-triangle-exclamation status-critico"></i>';
          texto.innerText = "¡ALERTA DE NIVEL BAJO!";
          subtexto.innerText = "Nivel cayó por debajo del 50%. Inspeccionar bombas/llaves.";
          badge.innerText = "CRÍTICO";
          badge.style.color = "var(--red)";
          btnMute.style.display = 'flex';
          iniciarSirena();
        } else {
          tarjeta.className = "card";
          icono.innerHTML = '<i class="fa-solid fa-circle-check status-ok"></i>';
          texto.innerText = "Suministro Normal";
          subtexto.innerText = "Nivel por encima del 50%";
          badge.innerText = "SISTEMA OK";
          badge.style.color = "var(--green)";
          btnMute.style.display = 'none';
          detenerSirena();
        }
      });

      // Escuchar Bomba
      db.ref(`/clientes/${clienteActual}/telemetria/agua/bomba_1_estado`).on('value', (snap) => {
        estadoBomba = snap.val();
        const btn = document.getElementById('btnBomba');
        if(estadoBomba) {
          btn.className = "btn btn-on";
          btn.innerHTML = '<i class="fa-solid fa-power-off"></i> BOMBA ACTIVADA';
        } else {
          btn.className = "btn btn-off";
          btn.innerHTML = '<i class="fa-solid fa-power-off"></i> BOMBA APAGADA';
        }
      });
    }

    function toggleBomba() {
      db.ref(`/clientes/${clienteActual}/telemetria/agua/bomba_1_estado`).set(!estadoBomba);
    }

    function verModulo(mod, e) {
      document.getElementById('mod-agua').style.display = mod === 'agua' ? 'block' : 'none';
      document.getElementById('mod-hardware').style.display = mod === 'hardware' ? 'block' : 'none';

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(e) e.currentTarget.classList.add('active');
    }

    function nuevoCliente() {
      const nombre = prompt("Nombre de la nueva empresa o cliente:");
      if (nombre) {
        const id = nombre.toLowerCase().replace(/ /g, '_');
        db.ref(`/clientes/${id}`).set({
          nombre: nombre,
          telemetria: { agua: { boya_bajo_50: false, bomba_1_estado: false } }
        });
      }
    }

    function eliminarClienteActual() {
      if (confirm(`¿Borrar "${clienteActual}"?`)) {
        db.ref(`/clientes/${clienteActual}`).remove();
      }
    }
  </script>
</body>
</html>
