<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTEX - Telemetría IoT</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: var(--accent);
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .controls-bar {
      margin-bottom: 20px;
    }

    .btn-sound {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .card.alert {
      border-color: var(--danger);
      animation: pulse-danger 1s infinite alternate;
    }

    @keyframes pulse-danger {
      from { box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
      to { box-shadow: 0 0 25px rgba(239, 68, 68, 0.9); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .status-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .status-ok { background-color: #166534; color: #4ade80; }
    .status-danger { background-color: #991b1b; color: #fca5a5; }

    .sensor-item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      font-size: 1.1rem;
    }

    .val-ok { color: var(--success); font-weight: bold; }
    .val-danger { color: var(--danger); font-weight: bold; }
  </style>
</head>
<body>

  <h1>VOLTEX IoT</h1>
  <div class="subtitle">Monitoreo de Telemetría en Tiempo Real</div>

  <div class="controls-bar">
    <button class="btn-sound" onclick="habilitarNotificacionesYAudio()">🔔 Habilitar Alertas de Sonido y Push</button>
  </div>

  <div id="card-don-felix" class="card">
    <div class="card-header">
      <h2>Don Félix</h2>
      <span id="badge-estado" class="status-badge status-ok">NORMAL</span>
    </div>
    
    <div class="sensor-item">
      <span>Nivel Tanque Agos (50%):</span>
      <span id="val-boya" class="val-ok">100% OK</span>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Configuración Firebase VOLTEX
    const firebaseConfig = {
      databaseURL: "https://voltex-iot-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let audioCtx = null;
    let alarmInterval = null;
    let alertaActiva = false;

    // Inicializar Web Audio API e interactuar con el usuario
    function habilitarNotificacionesYAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if ("Notification" in window) {
        Notification.requestPermission().then(perm => {
          if (perm === "granted") {
            alert("¡Alertas sonoras y Notificaciones Push activadas con éxito!");
          } else {
            alert("Permiso de notificaciones denegado.");
          }
        });
      }
    }

    // Generador de Sirena de Alarma en Web Audio API (Sin archivos mp3 externos)
    function reproducirTonoAlarma() {
      if (!audioCtx) return;
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // Nota A5
      osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.4); // Baja a A4

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    function dispararAlarmaProcesada() {
      // 1. Vibración del celular (si lo soporta)
      if ("vibrate" in navigator) {
        navigator.vibrate([500, 200, 500, 200, 500]);
      }

      // 2. Notificación Push en el sistema
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("🚨 ¡ALERTA CRÍTICA EN VOLTEX!", {
          body: "Cliente: Don Félix - El nivel de agua ha bajado del 50%.",
          icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png"
        });
      }

      // 3. Reproducir sirena continua mientras persista la alerta
      if (!alarmInterval) {
        reproducirTonoAlarma();
        alarmInterval = setInterval(reproducirTonoAlarma, 600);
      }
    }

    function detenerAlarma() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    // Escuchar datos de Firebase en tiempo real
    const refAgua = db.ref('clientes/don_felix/telemetria/agua');
    
    refAgua.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const faltaAgua = data.boya_medio_tanque === true;
      const card = document.getElementById('card-don-felix');
      const badge = document.getElementById('badge-estado');
      const valBoya = document.getElementById('val-boya');

      if (faltaAgua) {
        // Estado de ALERTA
        card.classList.add('alert');
        badge.className = "status-badge status-danger";
        badge.innerText = "🚨 ALERTA CRÍTICA";
        valBoya.className = "val-danger";
        valBoya.innerText = "⚠️ MENOS DEL 50%";

        if (!alertaActiva) {
          alertaActiva = true;
          dispararAlarmaProcesada();
        }
      } else {
        // Estado NORMAL
        card.classList.remove('alert');
        badge.className = "status-badge status-ok";
        badge.innerText = "NORMAL";
        valBoya.className = "val-ok";
        valBoya.innerText = "100% OK";

        alertaActiva = false;
        detenerAlarma();
      }
    });
  </script>
</body>
</html>
