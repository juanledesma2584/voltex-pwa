<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTEX Enterprise IoT</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151c2e;
      --border: #232d42;
      --accent: #38bdf8;
      --green: #10b981;
      --red: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --subtext: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }

    .top-bar {
      width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; background: var(--card-bg); padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border);
    }
    .brand { font-size: 1.4rem; font-weight: 900; color: var(--accent); letter-spacing: 1.5px; display: flex; align-items: center; gap: 10px; }
    .brand-logo-svg { width: 38px; height: 38px; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    .client-picker { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; font-weight: 700; outline: none; }

    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }
    .module-nav { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--subtext); padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
    .tab-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(56, 189, 248, 0.1); }

    .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-bottom: 15px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .card-title { font-weight: 700; font-size: 1.1rem; color: var(--text); display: flex; align-items: center; gap: 8px; }

    /* Estilos para listas de bombas/tanques/ascensores */
    .pump-item, .elevator-item {
      background: #0f172a; border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pump-info h4 { font-size: 1rem; color: var(--text); }
    .pump-info p { font-size: 0.85rem; color: var(--subtext); margin-top: 2px; }
    .amp-badge { font-size: 1.1rem; font-weight: 800; color: var(--warning); background: rgba(245, 158, 11, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(245, 158, 11, 0.3); }

    .stat-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-box { background: #0f172a; border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
    .stat-box .val { font-size: 1.8rem; font-weight: 800; color: var(--accent); }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-on { background: var(--green); color: white; }
    .btn-off { background: var(--red); color: white; }
    .btn-secondary { background: #334155; color: white; }
    .admin-panel { margin-top: 20px; padding: 16px; background: rgba(255,255,255,0.02); border: 1px dashed var(--border); border-radius: 12px; text-align: center; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <div class="brand-logo-svg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path></svg>
      </div>
      <span>VOLTEX</span>
    </div>
    <select class="client-picker" id="selectCliente" onchange="cargarCliente(this.value)"></select>
  </div>

  <div class="container">
    <div class="module-nav" id="navegacionModulos">
      <button class="tab-btn active" id="tab-agua" onclick="verModulo('agua', event)"><i class="fa-solid fa-droplet"></i> Sistema Agua</button>
      <button class="tab-btn" id="tab-ascensor" onclick="verModulo('ascensor', event)"><i class="fa-solid fa-elevator"></i> Ascensores</button>
    </div>

    <!-- MÓDULO AGUA MULTI-BOMBA Y MULTI-TANQUE -->
    <div id="mod-agua">
      <!-- Resumen General -->
      <div class="stat-summary">
        <div class="stat-box">
          <small style="color: var(--subtext);">Bombas En Marcha</small>
          <div class="val" id="totalBombasActivas">0 / 0</div>
        </div>
        <div class="stat-box">
          <small style="color: var(--subtext);">Amperaje Total</small>
          <div class="val" style="color: var(--warning);" id="totalAmperaje">0.0 A</div>
        </div>
      </div>

      <!-- Lista de Tanques / Boyas -->
      <div class="card">
        <div class="card-header"><div class="card-title"><i class="fa-solid fa-water"></i> Monitoreo de Tanques</div></div>
        <div id="listaTanques"><p style="color: var(--subtext); text-align: center;">Cargando tanques...</p></div>
      </div>

      <!-- Lista de Bombas / Amperaje -->
      <div class="card">
        <div class="card-header"><div class="card-title"><i class="fa-solid fa-gears"></i> Grupo de Bombeo y Amperaje</div></div>
        <div id="listaBombas"><p style="color: var(--subtext); text-align: center;">Cargando bombas...</p></div>
      </div>
    </div>

    <!-- MÓDULO MULTI-ASCENSOR -->
    <div id="mod-ascensor" style="display: none;">
      <div class="card">
        <div class="card-header"><div class="card-title"><i class="fa-solid fa-elevator"></i> Red de Ascensores</div></div>
        <div id="listaAscensores"><p style="color: var(--subtext); text-align: center;">Cargando ascensores...</p></div>
      </div>
    </div>

    <div class="admin-panel">
      <small style="color: var(--subtext);">Gestión de Infraestructura</small>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-secondary" onclick="nuevoCliente()"><i class="fa-solid fa-plus"></i> Cargar Cliente Multi-Nodo</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://voltex-iot-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let clienteActual = '';

    db.ref('/clientes').on('value', (snapshot) => {
      const picker = document.getElementById('selectCliente');
      picker.innerHTML = '';
      const clientes = snapshot.val();
      if (!clientes) return;

      Object.keys(clientes).forEach(id => {
        const option = document.createElement('option');
        option.value = id; option.innerText = clientes[id].nombre || id;
        picker.appendChild(option);
      });

      if (!clienteActual || !clientes[clienteActual]) clienteActual = Object.keys(clientes)[0];
      picker.value = clienteActual;
      cargarCliente(clienteActual);
    });

    function cargarCliente(clienteId) {
      clienteActual = clienteId;

      // Escuchar Telemetría de Agua (Multi-Tanque y Multi-Bomba)
      db.ref(`/clientes/${clienteActual}/telemetria/agua`).on('value', (snap) => {
        const aguaData = snap.val() || {};
        
        // 1. Renderizar Tanques
        const contenedorTanques = document.getElementById('listaTanques');
        contenedorTanques.innerHTML = '';
        const tanques = aguaData.tanques || {};
        
        if (Object.keys(tanques).length === 0) {
          contenedorTanques.innerHTML = '<small style="color: var(--subtext);">Sin tanques configurados.</small>';
        } else {
          Object.keys(tanques).forEach(tId => {
            const t = tanques[tId];
            const estaCritico = t.boya_bajo_50;
            contenedorTanques.innerHTML += `
              <div class="pump-item" style="border-left: 4px solid ${estaCritico ? 'var(--red)' : 'var(--green)'};">
                <div>
                  <strong>${t.nombre || tId}</strong><br>
                  <small style="color: ${estaCritico ? 'var(--red)' : 'var(--green)'}; font-weight:700;">
                    ${estaCritico ? '¡ALERTA: NIVEL BAJO (< 50%)!' : 'Suministro Conforme'}
                  </small>
                </div>
                <i class="${estaCritico ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-circle-check'}" style="font-size:1.5rem; color:${estaCritico ? 'var(--red)' : 'var(--green)'};"></i>
              </div>
            `;
          });
        }

        // 2. Renderizar Bombas con Consumo de Amperaje
        const contenedorBombas = document.getElementById('listaBombas');
        contenedorBombas.innerHTML = '';
        const bombas = aguaData.bombas || {};
        let activasCount = 0;
        let totalBombas = Object.keys(bombas).length;
        let amperajeSuma = 0.0;

        if (totalBombas === 0) {
          contenedorBombas.innerHTML = '<small style="color: var(--subtext);">Sin bombas configuradas.</small>';
        } else {
          Object.keys(bombas).forEach(bId => {
            const b = bombas[bId];
            const corriente = parseFloat(b.corriente_amperios || 0.0);
            const encendida = b.estado || false;

            if (encendida) activasCount++;
            amperajeSuma += corriente;

            contenedorBombas.innerHTML += `
              <div class="pump-item">
                <div class="pump-info">
                  <h4>${b.nombre || bId}</h4>
                  <p>Consumo individual: <strong style="color:white;">${corriente.toFixed(1)} A</strong></p>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                  <span class="amp-badge">${corriente.toFixed(1)} A</span>
                  <button class="btn ${encendida ? 'btn-on' : 'btn-off'}" style="width:auto; padding:8px 12px;" onclick="toggleBombaId('${bId}', ${!encendida})">
                    ${encendida ? 'ON' : 'OFF'}
                  </button>
                </div>
              </div>
            `;
          });
        }

        document.getElementById('totalBombasActivas').innerText = `${activasCount} / ${totalBombas}`;
        document.getElementById('totalAmperaje').innerText = `${amperajeSuma.toFixed(1)} A`;
      });

      // Escuchar Telemetría Multi-Ascensor
      db.ref(`/clientes/${clienteActual}/telemetria/ascensores`).on('value', (snap) => {
        const contenedor = document.getElementById('listaAscensores');
        contenedor.innerHTML = '';
        const ascensores = snap.val() || {};

        if (Object.keys(ascensores).length === 0) {
          contenedor.innerHTML = '<small style="color: var(--subtext);">Sin ascensores configurados.</small>';
          return;
        }

        Object.keys(ascensores).forEach(aId => {
          const a = ascensores[aId];
          contenedor.innerHTML += `
            <div class="elevator-item" style="border-left: 4px solid ${a.falla ? 'var(--red)' : 'var(--accent)'};">
              <div>
                <strong>${a.nombre || aId}</strong><br>
                <small style="color:var(--subtext);">Estado Puerta: ${a.puertas || 'CERRADA'}</small>
              </div>
              <div style="text-align:right;">
                <div style="font-size:1.5rem; font-weight:900; color:var(--accent);">${a.piso || 'PB'}</div>
                <small style="color:${a.falla ? 'var(--red)' : 'var(--green)'}; font-weight:700;">${a.falla ? 'FALLA' : 'OK'}</small>
              </div>
            </div>
          `;
        });
      });
    }

    function toggleBombaId(bombaId, nuevoEstado) {
      db.ref(`/clientes/${clienteActual}/telemetria/agua/bombas/${bombaId}/estado`).set(nuevoEstado);
    }

    function verModulo(mod, e) {
      document.getElementById('mod-agua').style.display = mod === 'agua' ? 'block' : 'none';
      document.getElementById('mod-ascensor').style.display = mod === 'ascensor' ? 'block' : 'none';
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(e) e.currentTarget.classList.add('active');
    }

    function nuevoCliente() {
      const nombre = prompt("Nombre del edificio (ej: Don Félix):");
      if (nombre) {
        const id = nombre.toLowerCase().replace(/ /g, '_');
        db.ref(`/clientes/${id}`).set({
          nombre: nombre,
          telemetria: {
            agua: {
              tanques: {
                tanque_superior: { nombre: "Tanque Superior", boya_bajo_50: false },
                tanque_inferior: { nombre: "Cisterna Inferior", boya_bajo_50: false }
              },
              bombas: {
                bomba_1: { nombre: "Bomba Principal #1", estado: true, corriente_amperios: 8.4 },
                bomba_2: { nombre: "Bomba Auxiliar #2", estado: false, corriente_amperios: 0.0 }
              }
            },
            ascensores: {
              ascensor_1: { nombre: "Ascensor Principal", piso: "Piso 2", falla: false, puertas: "CERRADAS" }
            }
          }
        });
      }
    }
  </script>
</body>
</html>
