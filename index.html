<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTEX - Panel de Control</title>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background-color: #1e293b;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .title { font-size: 1.2rem; font-weight: bold; color: #38bdf8; }
    .status { font-size: 0.85rem; padding: 4px 8px; border-radius: 6px; background: #065f46; color: #34d399; }
    .gauge-container { text-align: center; margin: 20px 0; }
    .gauge-value { font-size: 3rem; font-weight: bold; color: #38bdf8; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-on { background-color: #22c55e; color: white; }
    .btn-off { background-color: #ef4444; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <span class="title">VOLTEX | Don Félix</span>
      <span class="status">EN LÍNEA</span>
    </div>

    <!-- Módulo Agua -->
    <h3>Tanque Superior</h3>
    <div class="gauge-container">
      <div class="gauge-value"><span id="nivelAgua">--</span>%</div>
      <small style="color: #94a3b8;">Nivel de Agua en Tiempo Real</small>
    </div>

    <hr style="border-color: #334155; margin: 20px 0;">

    <h3>Control de Bomba 1</h3>
    <button id="btnBomba" class="btn btn-off" onclick="toggleBomba()">CARGANDO...</button>
  </div>

  <script>
    // Configuración de tu Firebase
    const firebaseConfig = {
      databaseURL: "https://voltex-iot-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let estadoActual = false;

    // Escuchar Nivel de Agua en vivo
    db.ref('/clientes/don_felix/telemetria/agua/tanque_superior_pct').on('value', (snapshot) => {
      document.getElementById('nivelAgua').innerText = snapshot.val() || '0';
    });

    // Escuchar Estado de la Bomba en vivo
    db.ref('/clientes/don_felix/telemetria/agua/bomba_1_estado').on('value', (snapshot) => {
      estadoActual = snapshot.val();
      const btn = document.getElementById('btnBomba');
      if (estadoActual) {
        btn.innerText = "ENCENDIDO (Tocar para Apagar)";
        btn.className = "btn btn-on";
      } else {
        btn.innerText = "APAGADO (Tocar para Encender)";
        btn.className = "btn btn-off";
      }
    });

    // Cambiar estado desde la app
    function toggleBomba() {
      db.ref('/clientes/don_felix/telemetria/agua/bomba_1_estado').set(!estadoActual);
    }
  </script>
</body>
</html>
