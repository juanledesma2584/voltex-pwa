<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTEX - Sistema de Telemetría e IoT</title>

  <!-- PWA & Favicon -->
  <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/bolt.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #38bdf8;
      --accent-blue: #2563eb;
      --status-green: #22c55e;
      --status-red: #ef4444;
      --status-warn: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 32px;
      height: 32px;
    }

    .brand h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-main);
    }

    .brand h1 span {
      color: var(--accent-cyan);
    }

    .system-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--status-green);
      background: rgba(34, 197, 94, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: var(--status-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--status-green);
    }

    .btn-sound-activate {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
      transition: transform 0.1s ease, box-shadow 0.2s ease;
    }

    .btn-sound-activate:active {
      transform: scale(0.98);
    }

    .client-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .client-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .client-card.critical-alert {
      border-color: var(--status-red);
      animation: alert-pulse 1s infinite alternate;
    }

    @keyframes alert-pulse {
      0% {
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.4);
      }
      100% {
        box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
        border-color: rgba(239, 68, 68, 1);
      }
    }

    .card-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .client-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-normal {
      background: rgba(34, 197, 94, 0.15);
      color: var(--status-green);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .badge-danger {
      background: rgba(239, 68, 68, 0.2);
      color: var(--status-red);
      border: 1px solid rgba(239, 68, 68, 0.5);
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .telemetry-item {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .telemetry-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .telemetry-value {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .val-ok {
      color: var(--status-green);
    }

    .val-alert {
      color: var(--status-red);
    }

    .system-selector {
      margin-top: 16px;
      display: flex;
      gap: 8px;
    }

    .sys-tab {
      flex: 1;
      padding: 8px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
    }

    .sys-tab.active {
      background: var(--accent-cyan);
      color: #0f172a;
      border-color: var(--accent-cyan);
    }

    footer {
      margin-top: auto;
      padding-top: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="https://img.icons8.com/fluency/48/bolt.png" alt="VOLTEX Logo">
      <h1>VOLTEX <span>IoT</span></h1>
    </div>
    <div class="system-status">
      <div class="dot"></div>
      EN LÍNEA
    </div>
  </header>

  <main class="client-list">
    <!-- Botón Activar Sirena + Push -->
    <button class="btn-sound-activate" onclick="solicitarPermisosPush()">
      🔔 ACTIVAR SISTEMA DE ALERTAS EN SEGUNDO PLANO
    </button>

    <!-- Cliente 1: Don Félix -->
    <div id="card-don_felix" class="client-card">
      <div class="card-title-bar">
        <div class="client-name">Don Félix</div>
        <div id="badge-don_felix" class="badge badge-normal">NORMAL</div>
      </div>

      <div class="telemetry-grid">
        <div class="telemetry-item">
          <div class="telemetry-label">
            💧 Nivel Tanque (Boya 50%):
          </div>
          <div id="boya-don_felix" class="telemetry-value val-ok">
            100% OK
          </div>
        </div>
      </div>

      <div class="system-selector">
        <div class="sys-tab active">AGUA</div>
        <div class="sys-tab" style="opacity: 0.4;">ASCENSORES</div>
        <div class="sys-tab" style="opacity: 0.4;">FRÍO</div>
      </div>
    </div>

    <!-- Cliente 2: Vesna -->
    <div id="card-vesna" class="client-card" style="opacity: 0.7;">
      <div class="card-title-bar">
        <div class="client-name">Vesna</div>
        <div class="badge badge-normal">EN ESPERA</div>
      </div>
      <div class="telemetry-grid">
        <div class="telemetry-item">
          <div class="telemetry-label">💧 Nivel Tanque:</div>
          <div class="telemetry-value val-ok">SIN MODULO</div>
        </div>
      </div>
    </div>

    <!-- Cliente 3: Juan Ledesma -->
    <div id="card-juan_ledesma" class="client-card" style="opacity: 0.7;">
      <div class="card-title-bar">
        <div class="client-name">Juan Ledesma</div>
        <div class="badge badge-normal">EN ESPERA</div>
      </div>
      <div class="telemetry-grid">
        <div class="telemetry-item">
          <div class="telemetry-label">💧 Nivel Tanque:</div>
          <div class="telemetry-value val-ok">SIN MODULO</div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    VOLTEX IoT Telemetry Platform v2.4 &bull; Desarrollado para Control Industrial
  </footer>

  <!-- Firebase Web SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Inicialización de Firebase
    const firebaseConfig = {
      databaseURL: "https://voltex-iot-default-rtdb.firebaseio.com"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let audioCtx = null;
    let alarmInterval = null;
    let estadoAlertaActual = false;
    let swRegistration = null;

    // 1. Registro del Service Worker para Notificaciones de Fondo
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            swRegistration = reg;
            console.log('VOLTEX Service Worker registrado con éxito:', reg.scope);
          })
          .catch(err => console.error('Error al registrar Service Worker:', err));
      });
    }

    // 2. Solicitar permisos de notificación persistentes al sistema operativo
    function solicitarPermisosPush() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          if (permission === "granted") {
            alert("¡Permisos activados! Las notificaciones Push llegarán incluso con el teléfono bloqueado.");
          } else {
            alert("Permiso de notificaciones denegado. Actívalo en la configuración de Chrome/Android.");
          }
        });
      }
    }

    // Sirena industrial generada por Web Audio API (cuando la app está abierta)
    function sonarSirena() {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(950, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.35);

      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    }

    function dispararAlertasGlobales() {
      // A) Vibración del teléfono
      if ("vibrate" in navigator) {
        navigator.vibrate([600, 250, 600, 250, 600]);
      }

      // B) Lógica para enviar Notificación al Service Worker de Fondo
      if (swRegistration && "Notification" in window && Notification.permission === "granted") {
        swRegistration.showNotification("🚨 ¡ALERTA CRÍTICA VOLTEX!", {
          body: "Cliente: Don Félix - El nivel de agua descendió bajo el 50%.",
          icon: "https://img.icons8.com/fluency/48/bolt.png",
          vibrate: [500, 200, 500, 200, 500],
          tag: "alerta-agua-don-felix",
          requireInteraction: true
        });
      }

      // C) Sirena continua mientras la app esté abierta
      if (!alarmInterval) {
        sonarSirena();
        alarmInterval = setInterval(sonarSirena, 550);
      }
    }

    function apagarAlertasGlobales() {
      if (alarmInterval) {
        clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    // Suscripción en Tiempo Real a Firebase
    const refAguaDonFelix = db.ref('clientes/don_felix/telemetria/agua');

    refAguaDonFelix.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const alertaActiva = (data.boya_medio_tanque === true);

      const card = document.getElementById('card-don_felix');
      const badge = document.getElementById('badge-don_felix');
      const boyaVal = document.getElementById('boya-don_felix');

      if (alertaActiva) {
        card.classList.add('critical-alert');
        badge.className = 'badge badge-danger';
        badge.innerText = '🚨 ALERTA CRÍTICA';

        boyaVal.className = 'telemetry-value val-alert';
        boyaVal.innerText = '⚠️ MENOS DEL 50%';

        if (!estadoAlertaActual) {
          estadoAlertaActual = true;
          dispararAlertasGlobales();
        }
      } else {
        card.classList.remove('critical-alert');
        badge.className = 'badge badge-normal';
        badge.innerText = 'NORMAL';

        boyaVal.className = 'telemetry-value val-ok';
        boyaVal.innerText = '100% OK';

        estadoAlertaActual = false;
        apagarAlertasGlobales();
      }
    });
  </script>
</body>
</html>
