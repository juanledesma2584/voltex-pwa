<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOLTEX Enterprise IoT</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151c2e;
      --border: #232d42;
      --accent: #38bdf8;
      --green: #10b981;
      --red: #ef4444;
      --warning: #f59e0b;
      --text: #f8fafc;
      --subtext: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .top-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .brand { 
      font-size: 1.4rem; 
      font-weight: 900; 
      color: var(--accent); 
      letter-spacing: 1.5px; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
    }

    .brand-logo-svg {
      width: 38px;
      height: 38px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
    }

    .client-picker {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      outline: none;
    }

    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }

    .module-nav {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .card-title { font-weight: 700; font-size: 1.1rem; color: var(--text); display: flex; align-items: center; gap: 8px; }

    .water-box { display: flex; align-items: center; justify-content: space-around; }
    .tank {
      width: 70px; height: 100px; border: 3px solid #334155; border-radius: 8px;
      position: relative; overflow: hidden; background: #0f172a;
    }
    .water-level {
      position: absolute; bottom: 0; width: 100%;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      transition: height 0.8s ease;
    }
    .big-stat { font-size: 3rem; font-weight: 800; color: var(--accent); }

    .temp-grid, .energy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-card {
      background: #0f172a; padding: 16px; border-radius: 12px; border: 1px solid var(--border);
      text-align: center;
    }
    .stat-val { font-size: 2.2rem; font-weight: 800; }
    .temp-cold { color: #38bdf8; }
    .temp-freeze { color: #818cf8; }
    .energy-val { color: #f59e0b; }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 10px;
      font-weight: 700; cursor: pointer; margin-top: 15px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-on { background: var(--green); color: white; }
    .btn-off { background: var(--red); color: white; }
    .btn-secondary { background: #334155; color: white; margin-top: 10px; }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); margin-top: 10px; }

    .device-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .device-item {
      display: flex; justify-content: space-between; align-items: center;
      background: #0f172a; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem;
    }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .dot-offline { background: var(--red); }

    .admin-panel {
      margin-top: 20px;
      padding: 16px;
      background: rgba(255,255,255,0.02);
      border: 1px dashed var(--border);
      border-radius: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand">
      <div class="brand-logo-svg">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
        </svg>
      </div>
      <span>VOLTEX</span>
    </div>
    <select class="client-picker" id="selectCliente" onchange="cargarCliente(this.value)"></select>
  </div>

  <div class="container">
    <div class="module-nav">
      <button class="tab-btn active" onclick="verModulo('agua', event)"><i class="fa-solid fa-droplet"></i> Agua</button>
      <button class="tab-btn" onclick="verModulo('frio', event)"><i class="fa-solid fa-snowflake"></i> Cámaras Frigoríficas</button>
      <button class="tab-btn" onclick="verModulo('energia', event)"><i class="fa-solid fa-plug"></i> Energía / Red</button>
      <button class="tab-btn" onclick="verModulo('hardware', event)"><i class="fa-solid fa-microchip"></i> Hardware ESP32</button>
    </div>

    <!-- MÓDULO AGUA -->
    <div id="mod-agua">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fa-solid fa-water"></i> Tanque Superior</div>
          <small style="color: var(--green); font-weight:700;">EN VIVO</small>
        </div>
        <div class="water-box">
          <div class="tank"><div class="water-level" id="waterFill" style="height: 0%;"></div></div>
          <div>
            <div class="big-stat"><span id="nivelAgua">--</span>%</div>
            <small style="color: var(--subtext);">Volumen Suministro</small>
          </div>
        </div>
        <button id="btnBomba" class="btn btn-off" onclick="toggleBomba()">CARGANDO...</button>
      </div>
    </div>

    <!-- MÓDULO CÁMARAS FRIGORÍFICAS -->
    <div id="mod-frio" style="display: none;">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fa-solid fa-temperature-arrow-down"></i> Monitoreo Térmico</div>
          <small style="color: var(--accent); font-weight:700;">SENSORES DS18B20</small>
        </div>
        <div class="temp-grid">
          <div class="stat-card">
            <small style="color: var(--subtext);">Cámara Lácteos</small>
            <div class="stat-val temp-cold"><span id="tempCamara1">--</span>°C</div>
            <small style="color: var(--green);">Set: 3.0°C</small>
          </div>
          <div class="stat-card">
            <small style="color: var(--subtext);">Congelados</small>
            <div class="stat-val temp-freeze"><span id="tempCamara2">--</span>°C</div>
            <small style="color: var(--green);">Set: -20.0°C</small>
          </div>
        </div>
      </div>
    </div>

    <!-- MÓDULO ENERGÍA -->
    <div id="mod-energia" style="display: none;">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fa-solid fa-bolt"></i> Telemetría Eléctrica (PZEM-004T)</div>
        </div>
        <div class="energy-grid">
          <div class="stat-card">
            <small style="color: var(--subtext);">Tensión Red</small>
            <div class="stat-val energy-val"><span id="voltaje">--</span>V</div>
          </div>
          <div class="stat-card">
            <small style="color: var(--subtext);">Potencia Total</small>
            <div class="stat-val energy-val"><span id="potencia">--</span>kW</div>
          </div>
        </div>
      </div>
    </div>

    <!-- MÓDULO HARDWARE (ESP32) -->
    <div id="mod-hardware" style="display: none;">
      <div class="card">
        <div class="card-header">
          <div class="card-title"><i class="fa-solid fa-microchip"></i> Dispositivos Asignados</div>
          <button class="btn-secondary" style="width: auto; padding: 6px 12px; margin: 0;" onclick="agregarESP32()">+ Nuevo ESP32</button>
        </div>
        <div class="device-list" id="listaDispositivos">
          <p style="color: var(--subtext); text-align: center;">Cargando lista de hardware...</p>
        </div>
      </div>
    </div>

    <!-- PANEL DE ADMINISTRACIÓN DE CLIENTES -->
    <div class="admin-panel">
      <small style="color: var(--subtext);">Gestión de Infraestructura</small>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" onclick="nuevoCliente()"><i class="fa-solid fa-plus"></i> Nuevo Cliente</button>
        <button class="btn btn-danger" onclick="eliminarClienteActual()"><i class="fa-solid fa-trash"></i> Borrar Cliente</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://voltex-iot-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let clienteActual = '';
    let estadoBomba = false;

    // Escuchar la lista de todos los clientes de Firebase
    db.ref('/clientes').on('value', (snapshot) => {
      const picker = document.getElementById('selectCliente');
      picker.innerHTML = '';
      const clientes = snapshot.val();

      if (!clientes) {
        picker.innerHTML = '<option value="">Sin Clientes</option>';
        return;
      }

      Object.keys(clientes).forEach(id => {
        const option = document.createElement('option');
        option.value = id;
        option.innerText = clientes[id].nombre || id;
        picker.appendChild(option);
      });

      if (!clienteActual || !clientes[clienteActual]) {
        clienteActual = Object.keys(clientes)[0];
      }
      
      picker.value = clienteActual;
      cargarCliente(clienteActual);
    });

    function cargarCliente(clienteId) {
      if(!clienteId) return;
      clienteActual = clienteId;
      
      // 1. Telemetría de Agua
      db.ref(`/clientes/${clienteActual}/telemetria/agua/tanque_superior_pct`).on('value', (snap) => {
        const val = snap.val() || 0;
        document.getElementById('nivelAgua').innerText = val;
        document.getElementById('waterFill').style.height = val + '%';
      });

      db.ref(`/clientes/${clienteActual}/telemetria/agua/bomba_1_estado`).on('value', (snap) => {
        estadoBomba = snap.val();
        const btn = document.getElementById('btnBomba');
        if(estadoBomba) {
          btn.className = "btn btn-on";
          btn.innerHTML = '<i class="fa-solid fa-power-off"></i> BOMBA ACTIVADA';
        } else {
          btn.className = "btn btn-off";
          btn.innerHTML = '<i class="fa-solid fa-power-off"></i> BOMBA APAGADA';
        }
      });

      // 2. Telemetría Térmica
      db.ref(`/clientes/${clienteActual}/telemetria/frio/camara_1_temp`).on('value', snap => {
        document.getElementById('tempCamara1').innerText = snap.val() || '2.4';
      });
      db.ref(`/clientes/${clienteActual}/telemetria/frio/camara_2_temp`).on('value', snap => {
        document.getElementById('tempCamara2').innerText = snap.val() || '-18.2';
      });

      // 3. Telemetría Eléctrica
      db.ref(`/clientes/${clienteActual}/telemetria/energia/voltaje`).on('value', snap => {
        document.getElementById('voltaje').innerText = snap.val() || '220';
      });
      db.ref(`/clientes/${clienteActual}/telemetria/energia/potencia_kw`).on('value', snap => {
        document.getElementById('potencia').innerText = snap.val() || '3.5';
      });

      // 4. Cargar lista de ESP32 asignados
      db.ref(`/clientes/${clienteActual}/dispositivos`).on('value', (snap) => {
        const contenedor = document.getElementById('listaDispositivos');
        contenedor.innerHTML = '';
        const devs = snap.val();

        if (!devs) {
          contenedor.innerHTML = '<p style="color: var(--subtext); text-align: center;">No hay ESP32 registrados en este nodo.</p>';
          return;
        }

        Object.keys(devs).forEach(devId => {
          const dev = devs[devId];
          const isOnline = dev.status === 'online';
          contenedor.innerHTML += `
            <div class="device-item">
              <div>
                <strong>${dev.nombre || devId}</strong><br>
                <small style="color: var(--subtext);">ID: ${devId} | IP: ${dev.ip || '192.168.1.X'}</small>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="status-dot ${isOnline ? 'dot-online' : 'dot-offline'}"></span>
                <small style="color: ${isOnline ? 'var(--green)' : 'var(--red)'}">${isOnline ? 'ONLINE' : 'OFFLINE'}</small>
              </div>
            </div>
          `;
        });
      });
    }

    function toggleBomba() {
      db.ref(`/clientes/${clienteActual}/telemetria/agua/bomba_1_estado`).set(!estadoBomba);
    }

    function verModulo(mod, e) {
      document.getElementById('mod-agua').style.display = mod === 'agua' ? 'block' : 'none';
      document.getElementById('mod-frio').style.display = mod === 'frio' ? 'block' : 'none';
      document.getElementById('mod-energia').style.display = mod === 'energia' ? 'block' : 'none';
      document.getElementById('mod-hardware').style.display = mod === 'hardware' ? 'block' : 'none';

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(e) e.currentTarget.classList.add('active');
    }

    // Funciones de administración (Crear / Eliminar)
    function nuevoCliente() {
      const nombre = prompt("Nombre de la nueva empresa o cliente:");
      if (nombre) {
        const id = nombre.toLowerCase().replace(/ /g, '_');
        db.ref(`/clientes/${id}`).set({
          nombre: nombre,
          telemetria: {
            agua: { tanque_superior_pct: 100, bomba_1_estado: false },
            frio: { camara_1_temp: 3.0, camara_2_temp: -20.0 },
            energia: { voltaje: 220, potencia_kw: 0.0 }
          },
          dispositivos: {
            esp32_principal: { nombre: "ESP32 Maestro", status: "online", ip: "192.168.1.100" }
          }
        });
        alert("Cliente creado exitosamente.");
      }
    }

    function eliminarClienteActual() {
      if (!clienteActual) return;
      if (confirm(`¿Estás seguro de que querés eliminar el cliente "${clienteActual}" y toda su telemetría?`)) {
        db.ref(`/clientes/${clienteActual}`).remove()
          .then(() => alert("Cliente eliminado de la base de datos."))
          .catch(err => alert("Error al eliminar: " + err.message));
      }
    }

    function agregarESP32() {
      if (!clienteActual) return;
      const idESP = prompt("Identificador del nuevo ESP32 (ej: esp32_tanque2):");
      if (idESP) {
        const devId = idESP.toLowerCase().replace(/ /g, '_');
        db.ref(`/clientes/${clienteActual}/dispositivos/${devId}`).set({
          nombre: idESP,
          status: "online",
          ip: "192.168.1.105"
        });
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
    }
  </script>
</body>
</html>
